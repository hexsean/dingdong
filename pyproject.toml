[project]
name = "dingdong"
version = "0.1.0"
description = "微信定时任务助手"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "apscheduler>=3.10.4",
    "requests>=2.31.0",
    "httpx[socks]>=0.27.0",
    "python-dotenv>=1.0.1",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.0.0",
    "exa_py>=1.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
dingdong = "dingdong.cli:main"
