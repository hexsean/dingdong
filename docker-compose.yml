services:
  dingdong:
    image: hexsean/dingdong:${DINGDONG_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - ./data:/app/data
    ports:
      - "${ADMIN_API_PORT:-8081}:8081"
    command: ["serve"]
    tty: true
    stdin_open: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://dingdong:8081
    depends_on:
      - dingdong
    profiles:
      - tunnel

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: ./data/updater.env
        required: false
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
    command: ["--api-version", "1.40", "--http-api-update", "--label-enable", "--cleanup"]
